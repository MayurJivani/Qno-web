# Coolify on Jinx (FRC/DEPLOY.md). Host network: the app listens on 3002 like
# its old systemd unit did, so its Caddy block, Postgres URL and env file are unchanged.
services:
  qno:
    image: ghcr.io/mayurjivani/qno:latest
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "dist/app.js"]
    env_file:
      - path: /etc/apps/qno.env
        required: false
    environment:
      NODE_ENV: "production"
      PORT: "3002"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
